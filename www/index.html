<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3B5C">
<title>SH Presta</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/updater.css">
</head>
<body>
<header class="top">
  <button id="retour" class="icone" data-act="retour" aria-label="Retour" hidden>‹</button>
  <h1 id="titre">SH Presta</h1>
  <span id="reseau" class="reseau" hidden></span>
  <button id="ouvrirReglages" class="icone" data-act="ouvrir-reglages" aria-label="Réglages" hidden>⚙</button>
</header>
<main id="app" aria-live="polite"></main>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="linkbtn" data-act="sheet-close" aria-label="Fermer">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="verrou" class="verrou" hidden>
  <div><p class="logo" aria-hidden="true">🔒</p><h2>SH Presta</h2><p>Application verrouillée</p><button class="btn primary large" data-act="deverrouiller">Déverrouiller</button></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
